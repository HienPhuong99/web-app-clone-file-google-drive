<!doctype html>
<html lang="vi">
<head>
<base target="_blank">
<meta charset="utf-8">
<style>
/*STYLE*/
.thumb img{background:var(--bg)}
.more-row{text-align:center;padding:16px}
.loading{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="menuBtn" aria-label="Menu">☰</button>
    <div class="logo">▲ Mini Drive</div>
    <input id="search" type="search" placeholder="Tìm theo tên hoặc nội dung…" aria-label="Tìm kiếm">
    <button class="icon" id="themeBtn" aria-label="Đổi giao diện" title="Sáng/Tối">◐</button>
    <button class="avatar" id="userBtn" aria-label="Tài khoản"></button>
  </header>
  <aside id="side">
    <div class="newwrap">
      <button class="btn new" id="newBtn">＋ Mới</button>
      <div class="menu" id="newMenu" hidden>
        <button data-act="newFolder">📁 Thư mục mới</button>
        <button data-act="uploadFile">⬆ Tải tệp lên</button>
        <button data-act="uploadFolder">🗂 Tải thư mục lên</button>
      </div>
    </div>
    <nav id="nav">
      <a href="#" target="_self" data-view="drive">🗄 Drive của tôi</a>
      <a href="#" target="_self" data-view="shared">👥 Được chia sẻ với tôi</a>
      <a href="#" target="_self" data-view="recent">🕑 Gần đây</a>
      <a href="#" target="_self" data-view="starred">⭐ Có gắn dấu sao</a>
      <a href="#" target="_self" data-view="trash">🗑 Thùng rác</a>
    </nav>
    <div class="quota"><div class="bar"><i id="quotaBar"></i></div><small id="quotaText"></small></div>
  </aside>
  <section id="main">
    <div class="toolbar">
      <div id="crumbs" class="crumbs"></div>
      <div class="spacer"></div>
      <button class="btn" id="emptyTrash" hidden>Dọn sạch thùng rác</button>
      <select id="sort" aria-label="Sắp xếp">
        <option value="name">Tên A→Z</option><option value="name-desc">Tên Z→A</option>
        <option value="updated">Mới sửa</option><option value="size">Dung lượng</option>
      </select>
      <button class="icon" id="viewBtn" aria-label="Chế độ xem" title="Lưới/Danh sách">▦</button>
    </div>
    <div id="selbar" hidden></div>
    <div id="list" tabindex="0"></div>
    <div id="more" class="more-row" hidden><button class="btn" id="moreBtn">Tải thêm</button></div>
    <div id="empty" class="empty" hidden></div>
    <div id="drop" hidden>Thả tệp hoặc thư mục để tải lên</div>
  </section>
</div>
<div class="menu ctx" id="ctx" hidden></div>
<div class="menu" id="userMenu" hidden><div class="muted pad" id="userInfo"></div></div>
<input type="file" id="fileIn" multiple hidden><input type="file" id="dirIn" webkitdirectory hidden><input type="file" id="verIn" hidden>
<div id="uploads" hidden></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<script>
/*SCRIPT*/
</script>
</body>
</html>
